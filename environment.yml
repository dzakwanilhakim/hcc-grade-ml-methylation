name: hcc-grade-ml
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - pip
  - jupyter
  - ipykernel
  - scikit-learn>=1.0
  - pandas>=1.3
  - numpy>=1.21
  - matplotlib>=3.5
  - seaborn>=0.11
  - openpyxl
  - r-base>=4.0
  - r-essentials
  - bioconductor-champ
  - bioconductor-rnbeads
  - bioconductor-limma
  - bioconductor-sva
  - bioconductor-minfi
  - bioconductor-clusterprofiler
  - bioconductor-pathview
  - bioconductor-org.hs.eg.db
  - pip:
    - tensorflow>=2.10
    - shap>=0.41
    - imbalanced-learn>=0.9
    - plotly>=5.0
